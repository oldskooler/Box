name: Android CI Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # Android环境设置 (核心修复点)
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-33
            build-tools;34.0.0
            cmdline-tools;latest
      
      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # 如果需要NDK（可选）
          # echo "ndk.dir=$ANDROID_HOME/ndk/25.2.9519653" >> local.properties
          cat local.properties
      
      # 缓存优化
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
      
      - name: Make gradlew executable
        run: chmod +x gradlew
      
      # 带诊断功能的Gradle构建
      - name: Build with Gradle
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --parallel \
            --build-cache \
            --warning-mode all \
            --stacktrace \
            --scan
        env:
          ORG_GRADLE_PROJECT_disablePreDex: true
      
      # APK文件处理
      - name: Find APK files
        id: find_apk
        run: |
          # 查找所有发布版APK
          apk_files=$(find . -path '*/*release/*.apk' -print)
          echo "Found APKs:"
          echo "$apk_files"
          
          # 创建上传目录
          mkdir -p ${{ github.workspace }}/apk
          
          # 移动并重命名文件
          counter=0
          for file in $apk_files; do
            filename=$(basename "$file")
            new_name="app-$(date +%Y%m%d)-$counter.apk"
            mv "$file" "${{ github.workspace }}/apk/$new_name"
            echo "Moved $filename to $new_name"
            ((counter++))
          done
          
          # 验证结果
          echo "Final APK list:"
          ls -lh ${{ github.workspace }}/apk/
          
          # 设置输出变量
          echo "apk_dir=${{ github.workspace }}/apk" >> $GITHUB_OUTPUT
          echo "apk_count=$counter" >> $GITHUB_OUTPUT
      
      # 上传结果
      - name: Upload APK artifact
        if: steps.find_apk.outputs.apk_count > 0
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.find_apk.outputs.apk_dir }}/*.apk
          retention-days: 7
      
      - name: Fail if no APK found
        if: steps.find_apk.outputs.apk_count == 0
        run: |
          echo "::error::No APK files found after build!"
          exit 1
